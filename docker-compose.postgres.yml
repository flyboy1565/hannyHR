# PostgreSQL override — start with:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
services:
  web:
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: hannyhr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hannyhr}
      POSTGRES_USER: ${POSTGRES_USER:-hannyhr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hannyhr}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata: